<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meterian Regulatory Readiness Check</title>
<meta name="description" content="A free six-minute self-assessment of software supply-chain risk against ISO/IEC 27001, ISO/IEC 42001, the NCSC Cyber Assessment Framework (CAF) v4.0, the EU Cyber Resilience Act (CRA) and the UK Software Security Code of Practice. Built by Meterian for CISOs, General Counsel and compliance leads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800&family=Lato:wght@400;700;900&family=Quicksand:wght@700&display=swap">
<style>
/* Layout: one working column of question cards (max 760px) beside a sticky
   Risk Profile rail that updates as answers land. On narrow screens the rail
   stacks under the questions and a slim fixed status bar sits at the bottom.
   A separate Report view is print-ready for Save as PDF.
   Accessibility (WCAG 2.2 AA): every text token is >= 4.5:1 on its surface,
   every control border and status colour >= 3:1, nothing is conveyed by
   colour alone, native radios and checkboxes carry the questions, focus is
   visible and never obscured, targets are >= 24px. */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --surface-2: #EAF0F9;
  --line: #D5DDE9;          /* decorative dividers only */
  --control: #6B7B92;       /* borders of form controls: 4.3:1 on white */
  --ink: #2F2F31;           /* brand charcoal: 13.4:1 */
  --ink-2: #566070;         /* 6.4:1 */
  --ink-3: #5B6778;         /* 5.7:1 (small labels) */
  --brand: #2883F8;         /* brand blue: wordmark, tints, borders (large text only) */
  --accent: #073AC9;        /* brand deep blue: text links, filled buttons: 8.5:1 with white */
  --accent-on: #FFFFFF;
  --accent-deep: #263E7E;   /* brand navy: profile header */
  --accent-tint: #E3EFFF;
  --low: #178F7A;           /* status colours: all >= 3:1 on white, always labelled */
  --medium: #A37100;
  --high: #D14A1E;
  --critical: #BC003F;      /* brand crimson */
  --focus: #0D4AFB;
  --shadow: 0 1px 2px rgba(38,62,126,.06), 0 8px 24px rgba(38,62,126,.08);
  --font-display: "Overpass", "Segoe UI", Arial, sans-serif;
  --font-body: "Lato", "Helvetica Neue", Arial, sans-serif;
  --font-logo: "Quicksand", "Nunito", "Segoe UI", sans-serif;
  --minibar: 88px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181F; --surface: #1C222B; --surface-2: #232B37; --line: #303A48; --control: #6E7D93;
    --ink: #E9EDF3; --ink-2: #B0B9C6; --ink-3: #99A4B3;
    --brand: #5AA3FF; --accent: #8FC0FF; --accent-on: #14181F; --accent-deep: #22365F; --accent-tint: #1C2E4A;
    --low: #1FA68C; --medium: #C98A12; --high: #E8622A; --critical: #E0306A; --focus: #FFD166;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181F; --surface: #1C222B; --surface-2: #232B37; --line: #303A48; --control: #6E7D93;
  --ink: #E9EDF3; --ink-2: #B0B9C6; --ink-3: #99A4B3;
  --brand: #5AA3FF; --accent: #8FC0FF; --accent-on: #14181F; --accent-deep: #22365F; --accent-tint: #1C2E4A;
  --low: #1FA68C; --medium: #C98A12; --high: #E8622A; --critical: #E0306A; --focus: #FFD166;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 16px; scroll-padding-bottom: calc(var(--minibar) + 16px); }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px calc(var(--minibar) + 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1024px) { .wrap { padding-bottom: 60px; } }
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--ink); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt:has(input:focus-visible), .chip:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
@supports not selector(:has(a)) { .opt:focus-within, .chip:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 16px; top: -100px; z-index: 30; background: var(--accent); color: var(--accent-on); padding: 10px 14px; border-radius: 8px; font-weight: 700; text-decoration: none; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; }

/* Header */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.wordmark { display: flex; flex-direction: column; gap: 2px; text-decoration: none; border-radius: 6px; }
.wordmark .m { font-family: var(--font-logo); font-weight: 700; font-size: 30px; color: var(--brand); letter-spacing: -.02em; line-height: 1; }
.wordmark .tag { font-size: 13px; color: var(--ink-3); letter-spacing: .01em; }
.wordmark .tag b { color: var(--ink); font-weight: 900; }
.badge-free { font-size: 13px; color: var(--ink-2); border: 1px solid var(--control); border-radius: 999px; padding: 4px 10px; }
.hero { margin-top: 28px; display: grid; gap: 14px; max-width: 820px; }
.hero p.lead { font-size: 17.5px; color: var(--ink-2); max-width: 66ch; }
.steps { display: flex; gap: 10px 18px; flex-wrap: wrap; margin-top: 4px; padding: 0; list-style: none; }
.step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.step i { font-style: normal; font-family: var(--font-display); font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-tint); color: var(--accent); font-size: 12px; }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; margin-top: 28px; }
@media (min-width: 1024px) { .grid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.col { min-width: 0; display: grid; gap: 28px; }
.rail { min-width: 0; }
@media (min-width: 1024px) { .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }

/* Sections */
.section { display: grid; gap: 14px; }
.section-head { display: grid; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.section-head .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head .count { font-size: 14px; color: var(--ink-3); }
.section-head .blurb { color: var(--ink-2); max-width: 70ch; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: .04em; color: var(--accent); background: var(--accent-tint); border-radius: 6px; padding: 4px 7px; line-height: 1; flex: none; margin-top: 2px; }
.weight { margin-left: auto; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.card .q { margin-top: 10px; color: var(--ink); font-weight: 700; }
.options { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: flex; align-items: flex-start; gap: 12px; position: relative; width: 100%; background: var(--surface); border: 1px solid var(--control); border-radius: 10px; padding: 12px; color: var(--ink); line-height: 1.4; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { background: var(--surface-2); }
.opt:has(input:checked) { border-color: var(--accent); border-width: 2px; padding: 11px; background: var(--accent-tint); }
.opt .radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--control); margin-top: 1px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; }
.opt .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); opacity: 0; }
.opt:has(input:checked) .radio { border-color: var(--accent); }
.opt:has(input:checked) .radio::after { opacity: 1; }
.opt .lvl { flex: none; width: 60px; font-size: 11.5px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; display: inline-flex; align-items: center; gap: 5px; }
.opt .lvl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.opt .txt { flex: 1; min-width: 0; }
.opt:has(input:checked) .lvl { color: var(--accent); }
@media (max-width: 480px) { .opt { flex-wrap: wrap; } .opt .lvl { order: 3; width: auto; margin-left: 32px; margin-top: -2px; } .opt .txt { flex-basis: calc(100% - 32px); } }
.more { display: grid; gap: 8px; margin-top: 12px; }
details.why { border-top: 1px dashed var(--line); padding-top: 8px; }
details.why summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 4px 2px 0; border-radius: 6px; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "+"; font-family: var(--font-display); width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-tint); font-size: 14px; }
details.why[open] summary::before { content: "–"; }
details.why .body { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); display: grid; gap: 6px; max-width: 70ch; }

/* Setup */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { position: relative; border: 1px solid var(--control); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all .15s; min-height: 36px; }
.chip:hover { border-color: var(--accent); }
.chip:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.chip .tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; flex: none; }
.chip .tick::after { content: ""; }
.chip:has(input:checked) .tick::after { content: "✓"; }
.chip .sub { font-weight: 400; font-size: 12.5px; opacity: .9; }
.field { display: grid; gap: 6px; }
.field > label, .field > legend { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.field input[type="text"] { font: inherit; padding: 10px 12px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; max-width: 420px; min-height: 44px; }
.setup-grid { display: grid; gap: 18px; }
.nudge { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--accent-tint); border: 1px solid color-mix(in srgb, var(--brand) 40%, var(--line)); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.nudge span { flex: 1 1 260px; min-width: 0; }
.btn { border: none; background: var(--accent); color: var(--accent-on); border-radius: 8px; padding: 9px 14px; font-weight: 700; font-size: 14px; min-height: 36px; }
.btn.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
.note { font-size: 13.5px; color: var(--ink-3); max-width: 70ch; }
.fullnames { font-size: 13.5px; color: var(--ink-2); display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.fullnames b { color: var(--ink); }

/* Rail */
.rail .card { display: grid; gap: 14px; }
.score-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 60px; line-height: .95; letter-spacing: -.02em; color: var(--ink); }
.score small { font-size: 16px; font-weight: 700; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.score.empty { color: var(--ink-3); }
.band { display: inline-flex; align-items: center; gap: 7px; font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; color: var(--ink); background: color-mix(in srgb, var(--c, var(--line)) 16%, var(--surface)); border: 1px solid var(--c, var(--control)); }
.band::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--control)); }
.band.sm { font-size: 11.5px; padding: 3px 8px; }
.provisional { font-size: 13px; color: var(--ink-3); }
.scale { position: relative; height: 10px; border-radius: 5px; overflow: hidden; display: grid; grid-template-columns: 26fr 25fr 25fr 25fr; gap: 2px; background: var(--surface); }
.scale span { display: block; height: 100%; }
.scale-wrap { position: relative; padding-top: 14px; }
.marker { position: absolute; top: 0; width: 2px; height: 24px; background: var(--ink); transform: translateX(-1px); border-radius: 1px; }
.marker::after { content: ""; position: absolute; top: -1px; left: 50%; width: 10px; height: 10px; background: var(--ink); border: 2px solid var(--surface); border-radius: 50%; transform: translate(-50%, -50%); }
.scale-labels { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 11px; color: var(--ink-3); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
.scale-labels span:nth-child(2), .scale-labels span:nth-child(3) { text-align: center; } .scale-labels span:last-child { text-align: right; }
.sub { display: grid; gap: 6px; }
.sub .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.sub .row b { font-family: var(--font-display); font-size: 16px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); transition: width .25s; }
.progress { display: grid; gap: 6px; }
.progress .row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--ink-2); }
.note-box { font-size: 14px; border-radius: 8px; padding: 10px 12px; background: var(--surface-2); border-left: 4px solid var(--c, var(--accent)); color: var(--ink-2); }
.gaps-mini { display: grid; gap: 6px; }
.gaps-mini .g { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.gaps-mini .g .code { font-size: 11.5px; padding: 3px 6px; margin: 0; }
.gaps-mini .g .n { flex: 1; min-width: 120px; }
.cta { border: none; background: var(--accent); color: var(--accent-on); font-weight: 900; font-size: 16px; padding: 13px 16px; border-radius: 10px; width: 100%; min-height: 48px; transition: filter .15s; }
.cta:hover { filter: brightness(1.12); }
.cta[disabled] { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--control); cursor: not-allowed; }
.cta-sub { font-size: 13px; color: var(--ink-3); text-align: center; }

/* Mobile status bar */
.minibar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.08);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.minibar .s { font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.minibar .s small { font-size: 13px; color: var(--ink-3); font-weight: 700; margin-left: 4px; }
.minibar button { min-height: 40px; }
@media (min-width: 1024px) { .minibar { display: none; } }

/* Profile section */
.profile { display: grid; gap: 22px; scroll-margin-top: 24px; }
.profile-head { display: grid; gap: 12px; background: var(--accent-deep); color: #fff; border-radius: 14px; padding: 22px; }
.profile-head h2, .profile-head .eyebrow { color: #fff; }
.profile-head .eyebrow { color: #C7D7F5; }
.profile-head .summary { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.profile-head .big { font-family: var(--font-display); font-weight: 800; font-size: 48px; line-height: 1; }
.profile-head .big small { font-size: 14px; color: #C7D7F5; margin-left: 4px; font-weight: 700; }
.profile-head .band { color: #2F2F31; background: #FFFFFF; border-color: #FFFFFF; }
.profile-head p { color: #DCE6F8; max-width: 72ch; }
.profile-head .sel { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.profile-head .sel li { font-size: 12.5px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; padding: 3px 9px; color: #fff; }
.profile-head .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.profile-head .btn { background: #fff; color: #263E7E; }
.profile-head .btn.secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.7); }
.flags, .gaps { display: grid; gap: 10px; }
.flag { display: grid; gap: 8px; }
.flag .t { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.flag .t h3 { flex: 1; min-width: 0; }
.date { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-tint); border-radius: 6px; padding: 4px 7px; white-space: nowrap; font-family: var(--font-display); }
.date.live { color: #fff; background: var(--critical); }
.status { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.status li { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--ink-2); }
.status li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--control)); }
.gap { display: grid; gap: 10px; border-left: 5px solid var(--c); }
.gap .t { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gap .t h3 { flex: 1; min-width: 0; }
.gap .ans { font-size: 14px; color: var(--ink-2); }
.gap .ans b { color: var(--ink); }
.two { display: grid; gap: 12px; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } }
.box { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.box .eyebrow { font-size: 11px; }
.box.mt { background: color-mix(in srgb, var(--brand) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--surface)); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; padding: 0; margin: 0; list-style: none; }
.pills li { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--surface); border: 1px solid color-mix(in srgb, var(--brand) 35%, var(--surface)); border-radius: 999px; padding: 2px 8px; }
details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
details.panel summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 16px; min-height: 24px; }
details.panel .body { margin-top: 10px; display: grid; gap: 10px; color: var(--ink-2); font-size: 14.5px; max-width: 80ch; }
.empty { color: var(--ink-2); font-size: 14.5px; }
footer { margin-top: 40px; font-size: 13.5px; color: var(--ink-3); display: grid; gap: 6px; max-width: 80ch; }

/* Report view */
.report { max-width: 820px; margin: 0 auto; display: grid; gap: 24px; }
.report-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.report-bar .l { display: flex; gap: 10px; flex-wrap: wrap; }
.report-paper { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 40px); display: grid; gap: 28px; box-shadow: var(--shadow); }
.r-head { display: grid; gap: 8px; border-bottom: 3px solid var(--brand); padding-bottom: 16px; }
.r-head .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-2); }
.r-section { display: grid; gap: 12px; break-inside: avoid-column; }
.r-section h2 { font-size: 18px; border-left: 4px solid var(--brand); padding-left: 10px; }
.r-scores { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .r-scores { grid-template-columns: 1fr; } }
.r-score { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.r-score .v { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.r-score .v small { font-size: 13px; color: var(--ink-3); margin-left: 3px; }
.r-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.r-list li { break-inside: avoid; }
.r-item { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
.r-item .t { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.r-item .t h3 { flex: 1; min-width: 0; font-size: 15.5px; }
.r-item p { font-size: 14.5px; color: var(--ink-2); }
.r-item p b { color: var(--ink); }
.r-item .mt { border-left: 3px solid var(--brand); padding-left: 10px; }
.r-foot { font-size: 13px; color: var(--ink-3); display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.print-help { font-size: 13.5px; color: var(--ink-3); }
@media print {
  @page { margin: 16mm; }
  html, body { background: #fff !important; color: #111 !important; }
  body::before, .skip, .report-bar, .minibar, .no-print { display: none !important; }
  .wrap { padding: 0 !important; max-width: none; }
  .report-paper { border: none; box-shadow: none; padding: 0; }
  .r-section, .r-item, .r-score { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the assessment</a>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="src/model.js"></script>
<script src="src/scoring.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;
const M = window.RMLC_MODEL;
const S = window.RMLC_SCORING;

const BAND_VAR = { low: "var(--low)", medium: "var(--medium)", high: "var(--high)", critical: "var(--critical)" };
const STORAGE_KEY = "rmlc_v1";
const EXPOSURE = M.DIMENSIONS.filter((d) => d.group === "exposure" && d.id !== "sector");
const CONTROLS = M.DIMENSIONS.filter((d) => d.group === "controls");
const SECTOR = M.DIMENSIONS.find((d) => d.id === "sector");
const NAMES = Object.assign({}, M.FRAMEWORKS, M.OVERLAYS);
const ALL_SEL = [].concat(M.FRAMEWORK_ORDER, M.REGULATION_ORDER, Object.keys(M.OVERLAYS));
/* The Claude artifact preview cannot open the print dialog; the live site can. */
const IN_PREVIEW = typeof window.claude !== "undefined";

function load() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {} return null; }
function save(state) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(iso) { if (!iso) return null; const [y, m, d] = iso.split("-").map(Number); return d ? `${d} ${MONTHS[m - 1]} ${y}` : `${MONTHS[m - 1]} ${y}`; }
const TODAY = new Date().toISOString().slice(0, 10);
const firstSentence = (s) => (s.match(/^[^.]+\./) || [s])[0];

/* ----------------------------------------------------------- Components */
function Band({ band, small }) {
  if (!band) return <span className={"band" + (small ? " sm" : "")}>Not yet rated</span>;
  return <span className={"band" + (small ? " sm" : "")} style={{ "--c": BAND_VAR[band.id] }}>{band.label}</span>;
}

function Chip({ id, on, onChange, children, sub }) {
  return (
    <label className="chip" htmlFor={id}>
      <input className="sr-only" type="checkbox" id={id} checked={on} onChange={onChange} />
      <span className="tick" aria-hidden="true"></span>
      <span>{children}</span>{sub && <span className="sub">{sub}</span>}
    </label>
  );
}

function QuestionCard({ dim, value, onSelect }) {
  return (
    <section className="card" id={"q-" + dim.id}>
      <fieldset>
        <legend>
          <div className="card-top">
            <span className="code" aria-hidden="true">{dim.code}</span>
            <h3><span className="sr-only">{dim.code} </span>{dim.name}</h3>
            <span className="weight num">Weight {dim.weight} of 3</span>
          </div>
          <p className="q">{dim.question}</p>
        </legend>
        <div className="options">
          {dim.options.map((o) => {
            const lvl = M.LEVELS[o.points];
            const id = `${dim.id}-${o.points}`;
            return (
              <label className="opt" key={o.points} htmlFor={id} style={{ "--c": BAND_VAR[lvl.id] }}>
                <input className="sr-only" type="radio" name={dim.id} id={id} value={o.points} checked={value === o.points} onChange={() => onSelect(dim.id, o.points)} />
                <span className="radio" aria-hidden="true"></span>
                <span className="lvl">{lvl.label}<span className="sr-only"> risk:</span></span>
                <span className="txt">{o.label}</span>
              </label>
            );
          })}
        </div>
      </fieldset>
      <div className="more">
        <details className="why"><summary>Why this matters</summary>
          <div className="body"><p>{dim.why}</p><p>{dim.whyWeight}</p></div>
        </details>
      </div>
    </section>
  );
}

function Scale({ score, band }) {
  const pct = score == null ? null : Math.max(0, Math.min(100, score));
  const label = "Risk scale from 0 to 100: Low 0 to 25, Medium 26 to 50, High 51 to 75, Critical 76 to 100." + (pct == null ? " No score yet." : ` Current score ${score}, ${band ? band.label : ""}.`);
  return (
    <div className="scale-wrap" role="img" aria-label={label}>
      {pct != null && <div className="marker" style={{ left: pct + "%" }}></div>}
      <div className="scale">{M.BANDS.map((b) => <span key={b.id} style={{ background: BAND_VAR[b.id] }}></span>)}</div>
      <div className="scale-labels" aria-hidden="true">{M.BANDS.map((b) => <span key={b.id}>{b.label}</span>)}</div>
    </div>
  );
}

function SubScore({ label, stats }) {
  const band = S.bandForScore(stats.score);
  return (
    <div className="sub">
      <div className="row"><span className="muted">{label} <span className="num">({stats.count} of {stats.total} answered)</span></span><b className="num">{stats.score == null ? "–" : stats.score}</b></div>
      <div className="bar" aria-hidden="true"><i style={{ width: (stats.score || 0) + "%", "--c": band ? BAND_VAR[band.id] : "var(--accent)" }}></i></div>
    </div>
  );
}

function Rail({ results, onProfile }) {
  const r = results;
  const answered = r.exposure.count + r.controls.count;
  const total = r.exposure.total + r.controls.total;
  const topGaps = r.gaps.slice(0, 3);
  const status = r.overall == null ? `${answered} of ${total} answered. Answer one question in each section to start the score.` : `Score ${r.overall} of 100, ${r.finalBand.label}. ${answered} of ${total} answered.`;
  return (
    <aside className="rail" aria-labelledby="rail-h">
      <div className="card">
        <div>
          <h2 className="eyebrow" id="rail-h">Your risk profile</h2>
          <p className="sr-only" role="status" aria-live="polite" aria-atomic="true">{status}</p>
          <div className="score-top" aria-hidden="true">
            <div className={"score num" + (r.overall == null ? " empty" : "")}>{r.overall == null ? "–" : r.overall}<small>/100</small></div>
            <Band band={r.finalBand} />
          </div>
          {!r.complete && <div className="provisional" aria-hidden="true">{r.overall == null ? "Answer one question in each section to start the score" : "Provisional until all twelve questions are answered"}</div>}
        </div>
        <Scale score={r.overall} band={r.finalBand} />
        <SubScore label="Exposure" stats={r.exposure} />
        <SubScore label="Controls" stats={r.controls} />
        <div className="progress">
          <div className="row"><span>Progress</span><span className="num">{answered} of {total} answered</span></div>
          <div className="bar" aria-hidden="true"><i style={{ width: (answered / total * 100) + "%", "--c": "var(--accent)" }}></i></div>
        </div>
        {r.override.note && <div className="note-box" style={{ "--c": r.override.applied ? "var(--critical)" : "var(--accent)" }}>{r.override.note}</div>}
        {topGaps.length > 0 && (
          <div className="gaps-mini">
            <h3 className="eyebrow">Largest gaps so far</h3>
            {topGaps.map((g) => (
              <div className="g" key={g.id}><span className="code" aria-hidden="true">{g.code}</span><span className="n">{g.name}</span><Band band={S.bandById(g.level.id)} small /></div>
            ))}
          </div>
        )}
        {r.flags.length > 0 && <div className="small muted"><b className="num">{r.flags.length}</b> obligation{r.flags.length === 1 ? "" : "s"} engaged by your answers and selections</div>}
        <button type="button" className="cta" disabled={!r.complete} onClick={onProfile}>{r.complete ? "See your full risk profile" : "Finish the questions to unlock"}</button>
        <div className="cta-sub">Free · no scan of your systems · nothing leaves this page until you choose to share it</div>
      </div>
    </aside>
  );
}

function Flag({ f, compact }) {
  const live = f.date && f.date <= TODAY;
  return (
    <div className={compact ? "r-item" : "card flag"}>
      <div className="t">
        <h3>{f.title}</h3>
        {f.date && <span className={"date" + (live ? " live" : "")}>{live ? "In force since " : "From "}{fmtDate(f.date)}</span>}
      </div>
      <p className="small muted">{f.text}</p>
      <ul className="status" aria-label="Your controls this obligation depends on">
        {f.status.map((s) => <li key={s.id} style={{ "--c": s.level ? BAND_VAR[s.level.id] : "var(--control)" }}>{s.code} {s.name}: {s.level ? s.level.label : "unanswered"}</li>)}
      </ul>
    </div>
  );
}

function Gap({ g }) {
  const isControl = g.group === "controls";
  const dim = M.DIMENSIONS.find((d) => d.id === g.id);
  return (
    <div className="card gap" style={{ "--c": BAND_VAR[g.level.id] }}>
      <div className="t"><span className="code" aria-hidden="true">{g.code}</span><h3><span className="sr-only">{g.code} </span>{g.name}</h3><Band band={S.bandById(g.level.id)} small /></div>
      <p className="ans"><b>Your answer:</b> {g.answer}</p>
      <div className="two">
        <div className="box"><h4 className="eyebrow">{isControl ? "What to do" : "What this means"}</h4><p>{g.action}</p></div>
        {g.meterian ? (
          <div className="box mt">
            <h4 className="eyebrow">How Meterian helps{g.meterian.partial ? " (in part)" : ""}</h4>
            <p>{g.meterian.summary}</p>
            <ul className="pills" aria-label="Meterian products">{g.meterian.products.map((p) => <li key={p}>{M.PRODUCTS[p].name}</li>)}</ul>
          </div>
        ) : (
          <div className="box"><h4 className="eyebrow">Why it raises the score</h4><p>{dim.why}</p></div>
        )}
      </div>
    </div>
  );
}

function Profile({ results, orgName, selections, onReset, onReport }) {
  const r = results;
  const sel = ALL_SEL.filter((id) => [].concat(selections.frameworks, selections.regulations, selections.overlays).includes(id));
  const controlGaps = r.gaps.filter((g) => g.group === "controls");
  const exposureGaps = r.gaps.filter((g) => g.group === "exposure");
  return (
    <section className="profile" id="profile" aria-labelledby="profile-h">
      <div className="profile-head" style={{ "--c": r.finalBand ? BAND_VAR[r.finalBand.id] : "var(--line)" }}>
        <h2 id="profile-h" className="eyebrow">4 · Your risk profile{orgName ? ` for ${orgName}` : ""}</h2>
        <div className="summary">
          <div className="big num" aria-label={r.overall == null ? "No score yet" : `Overall score ${r.overall} out of 100`}>{r.overall == null ? "–" : r.overall}<small aria-hidden="true">/100</small></div>
          <Band band={r.finalBand} />
          <div className="small" style={{ color: "#DCE6F8" }}>Exposure <b className="num">{r.exposure.score ?? "–"}</b> · Controls <b className="num">{r.controls.score ?? "–"}</b>{!r.complete && " · provisional"}</div>
        </div>
        <p style={{ color: "#fff", fontWeight: 700, fontSize: 17 }}>{r.finalBand ? r.finalBand.guidance : "Answer the questions above to build your profile."}</p>
        {r.override.applied && <p>{r.override.note}</p>}
        {sel.length > 0 && <ul className="sel" aria-label="Assessed against">{sel.map((id) => <li key={id}>{NAMES[id].full}</li>)}</ul>}
        <div className="actions">
          <button type="button" className="btn" disabled={!r.complete} onClick={onReport}>{r.complete ? "Open your report" : "Finish the questions to open the report"}</button>
          <button type="button" className="btn secondary" onClick={onReset}>Start again</button>
        </div>
      </div>

      <div className="section">
        <div className="section-head"><div className="row"><h3 style={{ fontSize: 21 }}>Obligations your answers engage</h3><span className="count num">{r.flags.length}</span></div>
          <p className="blurb">Regulation-specific requirements triggered by what you ship and the sector you serve, shown against where your controls stand today.</p></div>
        {r.flags.length ? <div className="flags">{r.flags.map((f) => <Flag key={f.id} f={f} />)}</div>
          : <p className="empty">{sel.length ? "None triggered yet: obligations appear once the Exposure questions are answered." : "Choose a framework or regulation in Setup to see the obligations it brings."}</p>}
      </div>

      <div className="section">
        <div className="section-head"><div className="row"><h3 style={{ fontSize: 21 }}>Prioritised gaps</h3><span className="count num">{controlGaps.length} control{controlGaps.length === 1 ? "" : "s"} · {exposureGaps.length} exposure</span></div>
          <p className="blurb">Controls first because they are what you can change, ordered by how much each one moves the score. Then the exposure drivers to size them against.</p></div>
        {r.gaps.length ? <div className="gaps">{r.gaps.map((g) => <Gap key={g.id} g={g} />)}</div>
          : <p className="empty">{r.complete ? "No dimension is in the High or Critical range. Maintain current controls and reassess on any material change." : "Gaps appear as you answer."}</p>}
      </div>

      <details className="panel"><summary>How the score works</summary><div className="body"><p>{M.METHODOLOGY}</p></div></details>
      <details className="panel"><summary>Disclaimer</summary><div className="body"><p>{M.DISCLAIMER}</p></div></details>
    </section>
  );
}

/* ----------------------------------------------------------- Report view */
function Report({ results, orgName, selections, onBack }) {
  const r = results;
  const h = useRef(null);
  useEffect(() => { if (h.current) h.current.focus(); window.scrollTo(0, 0); }, []);
  const sel = ALL_SEL.filter((id) => [].concat(selections.frameworks, selections.regulations, selections.overlays).includes(id));
  const controlGaps = r.gaps.filter((g) => g.group === "controls");
  const exposureGaps = r.gaps.filter((g) => g.group === "exposure");
  const publicSector = r.sector && r.sector.points === 3;
  const products = [...new Set(controlGaps.flatMap((g) => (g.meterian ? g.meterian.products : [])))].map((p) => M.PRODUCTS[p].name);
  const summary = r.finalBand ? (
    `${orgName || "Your organisation"} scores ${r.overall} out of 100 (${r.finalBand.label}) on this self-assessment: Exposure ${r.exposure.score}, Controls ${r.controls.score}. ` +
    (r.override.applied ? r.override.note + " " : "") +
    (controlGaps.length ? `${controlGaps.length} of the six controls ${controlGaps.length === 1 ? "is" : "are"} at High or Critical, led by ${controlGaps.slice(0, 2).map((g) => g.name).join(" and ")}. ` : "All six controls are at Low or Medium. ") +
    (r.flags.length ? `${r.flags.length} regulatory obligation${r.flags.length === 1 ? "" : "s"} ${r.flags.length === 1 ? "is" : "are"} engaged by what you ship and the sector you serve.` : "")
  ) : "";
  return (
    <div className="report">
      <div className="report-bar no-print">
        <div className="l">
          <button type="button" className="btn secondary" onClick={onBack}>← Back to the assessment</button>
          {!IN_PREVIEW && <button type="button" className="btn" onClick={() => window.print()}>Save as PDF</button>}
        </div>
        <span className="print-help">{IN_PREVIEW ? "Save as PDF is available on the live site; this preview cannot open the print dialog." : "Choose “Save as PDF” as the destination in the print dialog."}</span>
      </div>
      <article className="report-paper" aria-labelledby="r-title">
        <header className="r-head">
          <div className="brand"><span className="wordmark" aria-hidden="true"><span className="m">meterian</span><span className="tag">know your apps' risks <b>now</b></span></span></div>
          <h1 id="r-title" tabIndex="-1" ref={h} style={{ fontSize: 28 }}>Regulatory readiness report{orgName ? `: ${orgName}` : ""}</h1>
          <div className="meta">
            <span>Generated {fmtDate(TODAY)}</span>
            <span>Self-reported assessment · indicative only</span>
            {sel.length > 0 && <span>Assessed against: {sel.map((id) => NAMES[id].full).join("; ")}</span>}
          </div>
        </header>

        <section className="r-section" aria-labelledby="r-s1">
          <h2 id="r-s1">Executive summary</h2>
          <div className="r-scores">
            <div className="r-score"><span className="eyebrow">Overall</span><span className="v num">{r.overall ?? "–"}<small>/100</small></span><Band band={r.finalBand} small /></div>
            <div className="r-score"><span className="eyebrow">Exposure</span><span className="v num">{r.exposure.score ?? "–"}<small>/100</small></span><span className="small muted">What is at stake</span></div>
            <div className="r-score"><span className="eyebrow">Controls</span><span className="v num">{r.controls.score ?? "–"}<small>/100</small></span><span className="small muted">How well it is managed</span></div>
          </div>
          <p>{summary}</p>
          {r.finalBand && <p><b>What this rating means:</b> {r.finalBand.guidance}</p>}
        </section>

        <section className="r-section" aria-labelledby="r-s2">
          <h2 id="r-s2">Obligations engaged</h2>
          {r.flags.length ? r.flags.map((f) => <Flag key={f.id} f={f} compact />) : <p className="muted">No regulation-specific obligations were triggered by your selections and answers.</p>}
        </section>

        <section className="r-section" aria-labelledby="r-s3">
          <h2 id="r-s3">Prioritised gaps and how to close them</h2>
          {r.gaps.length ? r.gaps.map((g) => (
            <div className="r-item" key={g.id}>
              <div className="t"><h3>{g.code} · {g.name}</h3><Band band={S.bandById(g.level.id)} small /></div>
              <p><b>Your answer:</b> {g.answer}</p>
              <p><b>{g.group === "controls" ? "What to do:" : "What this means:"}</b> {g.action}</p>
              {g.meterian && <p className="mt"><b>How Meterian helps{g.meterian.partial ? " (in part)" : ""}:</b> {g.meterian.summary} <i>({g.meterian.products.map((p) => M.PRODUCTS[p].name).join(", ")})</i></p>}
            </div>
          )) : <p className="muted">No dimension is in the High or Critical range.</p>}
        </section>

        <section className="r-section" aria-labelledby="r-s4">
          <h2 id="r-s4">Recommended next steps</h2>
          <ol className="r-list">
            {controlGaps.slice(0, 3).map((g) => <li key={g.id}><b>{g.name}.</b> {firstSentence(g.action)}</li>)}
            {exposureGaps.slice(0, 1).map((g) => <li key={g.id}><b>{g.name}.</b> {firstSentence(g.action)}</li>)}
            <li><b>Make the evidence routine.</b> Whatever you fix, retain the output of each build as a record so the next audit, tender or regulator request is a download rather than a project.</li>
            <li><b>Talk to Meterian.</b> A 30-minute walkthrough of how {products.length ? products.join(", ") : "the Meterian platform"} would close the gaps above, with a scan of one of your own codebases if you want to see real findings. Meterian reads manifest files only and never your source code.{publicSector ? " On-premises and air-gapped deployment is available for public sector and CNI environments." : ""}</li>
          </ol>
        </section>

        <section className="r-section" aria-labelledby="r-s5">
          <h2 id="r-s5">Your answers</h2>
          <ol className="r-list">
            {M.DIMENSIONS.map((d) => { const p = r.answers[d.id]; const o = p == null ? null : d.options.find((x) => x.points === p); return <li key={d.id}><b>{d.code} {d.name}:</b> {o ? `${M.LEVELS[p].label} risk. ${o.label}` : "Not answered"}</li>; })}
          </ol>
        </section>

        <footer className="r-foot">
          <p><b>Methodology.</b> {M.METHODOLOGY}</p>
          <p><b>Disclaimer.</b> {M.DISCLAIMER}</p>
          <p>Model v{M.VERSION} · framework references current to {fmtDate(M.UPDATED)} · meterian.io</p>
        </footer>
      </article>
    </div>
  );
}

/* ----------------------------------------------------------- App */
function App() {
  const saved = useMemo(load, []);
  const [answers, setAnswers] = useState((saved && saved.answers) || {});
  const [selections, setSelections] = useState((saved && saved.selections) || { frameworks: [], regulations: [], overlays: [] });
  const [orgName, setOrgName] = useState((saved && saved.orgName) || "");
  const [view, setView] = useState("assessment");
  const results = useMemo(() => S.computeResults(answers, selections), [answers, selections]);

  useEffect(() => { save({ answers, selections, orgName }); }, [answers, selections, orgName]);

  const select = (id, pts) => setAnswers((a) => ({ ...a, [id]: pts }));
  const toggle = (group, id) => setSelections((s) => {
    const list = s[group].includes(id) ? s[group].filter((x) => x !== id) : s[group].concat(id);
    const next = { ...s, [group]: list };
    if (group === "frameworks" && !list.includes("caf")) next.overlays = s.overlays.filter((o) => M.OVERLAYS[o].parent !== "caf");
    return next;
  });
  const reset = () => { setAnswers({}); setSelections({ frameworks: [], regulations: [], overlays: [] }); setOrgName(""); try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} setView("assessment"); window.scrollTo({ top: 0, behavior: "smooth" }); const el = document.getElementById("org"); if (el) el.focus(); };
  const goProfile = () => { const el = document.getElementById("profile-h"); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } };
  const openReport = () => setView("report");
  const backFromReport = () => { setView("assessment"); setTimeout(goProfile, 0); };

  const cafOn = selections.frameworks.includes("caf");
  const suggestDtac = results.suggestedOverlays.includes("dtac");

  if (view === "report") {
    return (
      <div className="wrap" lang="en-GB">
        <main id="main"><Report results={results} orgName={orgName} selections={selections} onBack={backFromReport} /></main>
      </div>
    );
  }

  return (
    <div className="wrap" lang="en-GB">
      <header className="brand">
        <a className="wordmark" href="https://www.meterian.io" target="_blank" rel="noopener" aria-label="Meterian website (opens in a new tab)">
          <span className="m" aria-hidden="true">meterian</span>
          <span className="tag" aria-hidden="true">know your apps' risks <b>now</b></span>
        </a>
        <span className="badge-free">Free self-assessment · about 6 minutes</span>
      </header>

      <div className="hero">
        <p className="eyebrow">Regulatory readiness check</p>
        <h1>Is your software supply chain ready for the regulators?</h1>
        <p className="lead"> See your software supply-chain risk at a glance, the obligations you face under ISO/IEC 27001, ISO/IEC 42001, the NCSC Cyber Assessment Framework (CAF) v4.0, the EU Cyber Resilience Act (CRA) and the UK Software Security Code of Practice, and a prioritised plan for what to fix first.</p>
        <ol className="steps" aria-label="How it works">
          <li className="step"><i aria-hidden="true">1</i> Choose your frameworks and regulations</li>
          <li className="step"><i aria-hidden="true">2</i> Rate your exposure</li>
          <li className="step"><i aria-hidden="true">3</i> Rate your controls</li>
          <li className="step"><i aria-hidden="true">4</i> Read your profile and save the report</li>
        </ol>
      </div>

      <div className="grid">
        <main id="main" className="col">
          {/* ---------------- Setup ---------------- */}
          <div className="section" id="setup">
            <div className="section-head"><div className="row"><h2>1 · Choose your frameworks and regulations</h2><span className="count">Changes the mapping, never the score</span></div>
              <p className="blurb">Pick what you are assessed against. The report flags the obligations each selection brings and shows where your controls stand against them.</p></div>
            <div className="card setup-grid">
              <div className="field">
                <label htmlFor="org">Organisation name (optional, shown on your report)</label>
                <input id="org" type="text" value={orgName} onChange={(e) => setOrgName(e.target.value)} placeholder="e.g. Riverside NHS Foundation Trust" autoComplete="organization" />
              </div>
              <fieldset className="field">
                <legend>Target framework (choose one or more)</legend>
                <div className="chips">
                  {M.FRAMEWORK_ORDER.map((id) => <Chip key={id} id={"fw-" + id} on={selections.frameworks.includes(id)} onChange={() => toggle("frameworks", id)}>{M.FRAMEWORKS[id].full}</Chip>)}
                  {cafOn && <Chip id="ov-dtac" on={selections.overlays.includes("dtac")} onChange={() => toggle("overlays", "dtac")} sub="overlay on CAF">+ {M.OVERLAYS.dtac.full}</Chip>}
                </div>
                {cafOn && <p className="note">{M.OVERLAYS.dtac.note.replace(" Suggested when the sector is public sector or health.", "")} Add it if you supply digital health technology into the NHS.</p>}
              </fieldset>
              <fieldset className="field">
                <legend>Regulation or code of practice (choose one or more)</legend>
                <div className="chips">
                  {M.REGULATION_ORDER.map((id) => <Chip key={id} id={"reg-" + id} on={selections.regulations.includes(id)} onChange={() => toggle("regulations", id)}>{M.FRAMEWORKS[id].full}</Chip>)}
                </div>
                <p className="note">The Software Security Code of Practice is voluntary guidance that public-sector buyers increasingly ask suppliers to attest against; the Cyber Resilience Act is law for products placed on the EU market.</p>
              </fieldset>
              {suggestDtac && (
                <div className="nudge" role="status"><span>You serve the public sector or health. If you supply digital health technology into the NHS, the DTAC overlay adds its technical security and clinical safety expectations to your report.</span>
                  <button type="button" className="btn" onClick={() => toggle("overlays", "dtac")}>Add DTAC</button></div>
              )}
            </div>
            <QuestionCard dim={SECTOR} value={answers[SECTOR.id]} onSelect={select} />
          </div>

          {/* ---------------- Exposure ---------------- */}
          <div className="section" id="exposure">
            <div className="section-head"><div className="row"><h2>2 · Rate your exposure</h2><span className="count num">{results.exposure.count} of {results.exposure.total} answered · half the score</span></div>
              <p className="blurb">What is at stake. The risk you cannot engineer away: what you ship, who it affects, how much of it you did not write, how it is built and where it runs.</p></div>
            {EXPOSURE.map((d) => <QuestionCard key={d.id} dim={d} value={answers[d.id]} onSelect={select} />)}
          </div>

          {/* ---------------- Controls ---------------- */}
          <div className="section" id="controls">
            <div className="section-head"><div className="row"><h2>3 · Rate your controls</h2><span className="count num">{results.controls.count} of {results.controls.total} answered · half the score</span></div>
              <p className="blurb">How well it is managed, in the order a software lifecycle runs: know what you ship, gate it, watch it, fix it, disclose it, prove it. Weaker control scores as higher risk.</p></div>
            {CONTROLS.map((d) => <QuestionCard key={d.id} dim={d} value={answers[d.id]} onSelect={select} />)}
          </div>

          {/* ---------------- Profile ---------------- */}
          <Profile results={results} orgName={orgName} selections={selections} onReset={reset} onReport={openReport} />
        </main>

        <Rail results={results} onProfile={goProfile} />
      </div>

      <footer>
        <p>{M.DISCLAIMER}</p>
        <p>Frameworks referenced: {ALL_SEL.map((id) => NAMES[id].full).join("; ")}.</p>
        <p>Model v{M.VERSION} · framework references current to {fmtDate(M.UPDATED)} · Your answers stay in this browser until you choose to share them. This page is designed to meet WCAG 2.2 AA; if anything is hard to use, tell Meterian at support@meterian.io.</p>
      </footer>

      <div className="minibar no-print" aria-label="Risk profile shortcut">
        <div><div className="eyebrow">Risk profile</div><div className="s num">{results.overall == null ? "–" : results.overall}<small>/100 · {results.finalBand ? results.finalBand.label : "not rated"}</small></div></div>
        <button type="button" className="btn secondary" onClick={goProfile}>{results.complete ? "View profile" : `${results.exposure.count + results.controls.count} of 12 answered`}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
